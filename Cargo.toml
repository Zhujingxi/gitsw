[package]
name = "gitsw"
version = "0.1.0"
edition = "2024"
description = "A terminal picker for global Git identities and GitHub CLI accounts"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tempfile = "3.27.0"
unicode-width = "0.2.2"

[profile.release]
strip = true
lto = "thin"
